name: Refresh profile dashboard metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "26 3 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Explain required setup
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "::notice::Create a GitHub personal access token with only needed permissions and save it in this repository's Actions secrets as METRICS_TOKEN. Then rerun this workflow."
      - name: Generate isometric contribution calendar
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Senyobrahhh
          template: terminal
          filename: assets/metrics/calendar.svg
          base: ""
          config_timezone: Europe/Sofia
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Generate repository language breakdown
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Senyobrahhh
          template: terminal
          filename: assets/metrics/languages.svg
          base: ""
          config_timezone: Europe/Sofia
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
      - name: Generate coding activity charts
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Senyobrahhh
          template: classic
          filename: assets/metrics/activity.svg
          base: ""
          config_timezone: Europe/Sofia
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
