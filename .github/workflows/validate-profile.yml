name: Validate profile assets

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/validate-profile.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate SVGs and README references
        run: python3 scripts/validate_profile.py
      - name: Verify reproducible designed assets
        run: |
          python3 scripts/build_assets.py
          git diff --exit-code -- assets
