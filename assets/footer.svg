<svg xmlns="http://www.w3.org/2000/svg" width="960" height="126" viewBox="0 0 960 126" role="img" aria-labelledby="title desc">
<title id="title">Stay curious. Build things. Keep moving.</title>
<desc id="desc">Build. Test. Learn. Repeat.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1A2A"/><stop offset="1" stop-color="#080E19"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#32677B" stop-opacity=".26"/><stop offset="1" stop-color="#32677B" stop-opacity="0"/></radialGradient>
<radialGradient id="planet" cx=".3" cy=".25" r=".8"><stop stop-color="#203C50"/><stop offset=".7" stop-color="#0D1A2A"/><stop offset="1" stop-color="#080E19"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8CC8D8" stroke-opacity=".055"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="959" height="125" rx="16" fill="url(#surface)" stroke="#263E50" />

<path d="M40 31H78" fill="none" stroke="#8CC8D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="40" y="72" fill="#F2F6FA" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="32" font-weight="500" letter-spacing="-0.6" text-anchor="start" >Stay curious. Keep building.</text>
<text x="40" y="102" fill="#8CC8D8" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="500" letter-spacing="1.6" text-anchor="start" >BUILD. TEST. LEARN. REPEAT.</text>
<text x="920" y="72" fill="#A4B7C7" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" letter-spacing="1" text-anchor="end" >ENYO / SENYOBRAHHH</text>
</svg>
