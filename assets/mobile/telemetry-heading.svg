<svg xmlns="http://www.w3.org/2000/svg" width="420" height="146" viewBox="0 0 420 146" role="img" aria-labelledby="title desc">
<title id="title">GitHub telemetry</title>
<desc id="desc">Contribution history, repository languages and recent coding patterns, generated from GitHub data by Lowlighter Metrics.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1A2A"/><stop offset="1" stop-color="#080E19"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#32677B" stop-opacity=".26"/><stop offset="1" stop-color="#32677B" stop-opacity="0"/></radialGradient>
<radialGradient id="planet" cx=".3" cy=".25" r=".8"><stop stop-color="#203C50"/><stop offset=".7" stop-color="#0D1A2A"/><stop offset="1" stop-color="#080E19"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8CC8D8" stroke-opacity=".055"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="419" height="145" rx="16" fill="url(#surface)" stroke="#263E50" />

<text x="26" y="39" fill="#8CC8D8" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" letter-spacing="1.6" text-anchor="start" >04 / ACTIVITY</text>
<path d="M26 58H394" fill="none" stroke="#263E50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="26" y="106" fill="#F2F6FA" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="27" font-weight="600" letter-spacing="-0.6" text-anchor="start" >Signals from the work.</text>
<text x="26" y="131" fill="#A4B7C7" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start" >Contributions · Repository languages · Coding patterns</text>
</svg>
