<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1086" viewBox="0 0 420 1086" role="img" aria-labelledby="title desc">
<title id="title">Engineering flight plan — all eight stages are planned</title>
<desc id="desc">A learning roadmap, not completed projects. 1. Sensors &amp; circuits: Arduino · electronics fundamentals; 2. Telemetry &amp; logging: ESP32 · wireless data · SD logging; 3. Embedded foundations: STM32 · IMUs · sensor fusion; 4. Motion &amp; control: Motors · feedback loops · PID; 5. Autonomous robotics: Rovers · robotic arms · integration; 6. Custom hardware: PCB design · RTOS architecture; 7. Modular avionics: Flight computers · CAN bus; 8. Integrated testbeds: Spacecraft simulators · robotics. First planned build: an Arduino sensor station.</desc>
