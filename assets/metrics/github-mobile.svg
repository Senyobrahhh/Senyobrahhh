<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170" role="img" aria-labelledby="title desc">
<title id="title">Activity dashboard awaiting its first successful sync</title>
<desc id="desc">No statistics are shown until the Lowlighter Metrics workflow successfully generates real data.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1A2A"/><stop offset="1" stop-color="#080E19"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#32677B" stop-opacity=".26"/><stop offset="1" stop-color="#32677B" stop-opacity="0"/></radialGradient>
<radialGradient id="planet" cx=".3" cy=".25" r=".8"><stop stop-color="#203C50"/><stop offset=".7" stop-color="#0D1A2A"/><stop offset="1" stop-color="#080E19"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8CC8D8" stroke-opacity=".055"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="479" height="169" rx="16" fill="url(#surface)" stroke="#263E50" />

<circle cx="35" cy="34" r="4" fill="none" stroke="#8CC8D8" />
<text x="51" y="38" fill="#8CC8D8" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" letter-spacing="1.6" text-anchor="start" >AWAITING FIRST SYNC</text>
<text x="28" y="80" fill="#F2F6FA" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="25" font-weight="500" letter-spacing="0" text-anchor="start" >The work will speak for itself.</text>
<text x="28" y="113" fill="#A4B7C7" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start" >Contribution history, languages and coding patterns.</text>
<text x="28" y="139" fill="#A4B7C7" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" font-weight="400" letter-spacing="0" text-anchor="start" >Real data appears after the first successful refresh.</text>
</svg>
