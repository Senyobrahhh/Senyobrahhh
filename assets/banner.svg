<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Senyobrahhh — Software, Robotics, Space, animated orbit banner">
<defs>
 <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#080e19"/><stop offset=".56" stop-color="#0d1a2a"/><stop offset="1" stop-color="#173347"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#357b94" stop-opacity=".26"/><stop offset="1" stop-color="#357b94" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#9abec8" stroke-opacity=".095" fill="none"/></pattern>
</defs>
<style>
 .pulse{animation:pulse 3.4s ease-in-out infinite}.twinkle{animation:twinkle 4s ease-in-out infinite}
 .title{animation:arrive 1.5s ease-out both}.sub{animation:arrive 1.9s ease-out both}
 .scan{animation:scan 8s ease-in-out infinite}.cursor{animation:twinkle 1.1s steps(2,end) infinite}
 @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}
 @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
 @keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
 @keyframes scan{0%,100%{opacity:.2}50%{opacity:.5}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="310" fill="url(#bg)"/><rect width="1200" height="310" fill="url(#grid)"/>
<ellipse cx="993" cy="153" rx="263" ry="222" fill="url(#orb)"/>
<path d="M0 272Q285 218 511 258T1200 241" fill="none" stroke="#66a6ba" stroke-opacity=".23" stroke-width="1.3" class="scan"/>
<g transform="translate(984 156)" fill="none">
 <circle r="121" stroke="#83b9c9" stroke-opacity=".25"/><circle r="82" stroke="#83b9c9" stroke-opacity=".17" stroke-dasharray="4 8"/>
 <ellipse rx="165" ry="67" transform="rotate(-26)" stroke="#8bcbd5" stroke-opacity=".48"/>
 <ellipse rx="156" ry="58" transform="rotate(47)" stroke="#73a2b9" stroke-opacity=".23"/>
 <circle r="48" stroke="#abdde1" stroke-opacity=".34" fill="#1e3949" fill-opacity=".25"/>
 <path d="M-36 18Q0-13 32-32M-35-22Q1 1 37 16" stroke="#9cbdc8" stroke-opacity=".25"/>
</g>
<g>
 <animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M 836,202 C 840,260 1011,194 1110,124 S 1076,24 943,88 S 817,174 836,202"/>
 <g stroke="#a7d5db" stroke-width="1.7" fill="#1b3445"><rect x="-10" y="-10" width="20" height="20" rx="2"/><rect x="-47" y="-11" width="28" height="22"/><rect x="19" y="-11" width="28" height="22"/><path d="M-19 0h9M10 0h9M-38-11v22M-28-11v22M28-11v22M38-11v22M0-10v-13"/></g>
 </g>
<g fill="#8ccbd9"><circle cx="765" cy="87" r="2" class="twinkle"/><circle cx="1135" cy="58" r="2.4" class="pulse"/><circle cx="870" cy="271" r="1.8" class="twinkle"/><circle cx="1181" cy="232" r="1.9" class="pulse"/></g>
<path d="M70 56h540M70 264h540" stroke="#a9c1c9" stroke-opacity=".16"/>
<g class="title">
 <text x="72" y="95" font-family="Arial,sans-serif" font-weight="600" letter-spacing="3.8" fill="#90b3c2" font-size="15">PERSONAL SPACE  /  001</text>
 <text x="70" y="177" font-family="Arial,sans-serif" font-weight="bold" fill="#f1f6f8" font-size="66" letter-spacing="1">SENYOBRAHHH</text>
</g>
<g class="sub">
 <rect x="76" y="198" width="43" height="3" rx="1" fill="#84ceda"/>
 <text x="135" y="207" font-family="Arial,sans-serif" font-size="21" fill="#c2d7df" letter-spacing="1.3">Software · Robotics · Space</text>
 <text x="76" y="247" font-family="monospace" font-size="15" fill="#88a5b3">&gt; curiosity / building / exploration</text>
 <rect class="cursor" x="412" y="235" width="9" height="15" fill="#80ccdd"/>
</g>
<path d="M0 1h1200M0 309h1200" stroke="#91d3da" stroke-opacity=".27"/>
</svg>